services:
  - type: web
    name: crm-core-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Free plan: migrations run at startup. preDeployCommand is only
    # available on paid plans. If you upgrade, use:
    #   preDeployCommand: "flask db upgrade"
    #   startCommand: "gunicorn wsgi:app"
    startCommand: "flask db upgrade && gunicorn wsgi:app"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://crm-front.onrender.com"

databases:
  - name: crm-postgres
    plan: free
    region: oregon
